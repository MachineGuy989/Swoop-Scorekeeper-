<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SWOOP">

<title>SWOOP Scorekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --felt: #1B4A38;
    --felt-deep: #0F3324;
    --bg: #F0EDE3;
    --panel: #FFFFFF;
    --panel-soft: #F7F4EB;
    --ink: #1C1A17;
    --ink-soft: #6B6553;
    --ink-faint: #9B947E;
    --line: #DAD4C2;
    --accent: #C1442C;
    --accent-ink: #FFF7F0;
    --gold: #A9791F;
    --gold-bg: #FBF0D6;
    --gold-line: #E4C878;
    --danger: #A6402C;
    --shadow: 0 8px 24px -12px rgba(15, 51, 36, 0.35);
    --radius: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --felt: #123A2B;
      --felt-deep: #081F16;
      --bg: #141E19;
      --panel: #1D2A22;
      --panel-soft: #19241D;
      --ink: #EDE8DA;
      --ink-soft: #A6A08D;
      --ink-faint: #6F6A5A;
      --line: #2C3A31;
      --accent: #E2694C;
      --accent-ink: #1A0C08;
      --gold: #E0B84E;
      --gold-bg: #2E2712;
      --gold-line: #4E3F17;
      --danger: #E2694C;
      --shadow: 0 10px 28px -12px rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme="dark"] {
    --felt: #123A2B;
    --felt-deep: #081F16;
    --bg: #141E19;
    --panel: #1D2A22;
    --panel-soft: #19241D;
    --ink: #EDE8DA;
    --ink-soft: #A6A08D;
    --ink-faint: #6F6A5A;
    --line: #2C3A31;
    --accent: #E2694C;
    --accent-ink: #1A0C08;
    --gold: #E0B84E;
    --gold-bg: #2E2712;
    --gold-line: #4E3F17;
    --danger: #E2694C;
    --shadow: 0 10px 28px -12px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Libre Franklin", ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .display {
    font-family: "Anton", "Arial Narrow", sans-serif;
    font-weight: 400;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }

  .num {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }

  button {
    font-family: inherit;
  }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "swoop-scorekeeper-state-v1";
  var HISTORY_KEY = "swoop-scorekeeper-history-v1";
  var state = null;
  var editingRoundIndex = null; // null = new round entry; number = editing existing round

  // ---------- persistence ----------

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.players) || parsed.players.length < 2) return null;
      return parsed;
    } catch (e) { return null; }
  }

  function loadHistory() {
    try {
      var raw = localStorage.getItem(HISTORY_KEY);
      var parsed = raw ? JSON.parse(raw) : null;
      return (parsed && typeof parsed === "object") ? parsed : {};
    } catch (e) { return {}; }
  }

  function saveHistory(history) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
  }

  function commitGameToHistory() {
    if (!state || !isGameOver()) return;
    var history = loadHistory();
    var totals = runningTotals();
    var winners = winnerIndices();
    state.players.forEach(function (name, i) {
      var key = name.trim().toLowerCase();
      var entry = history[key] || { displayName: name, played: 0, wins: 0, losses: 0, lastScore: 0 };
      entry.displayName = name;
      entry.played += 1;
      if (winners.indexOf(i) !== -1) entry.wins += 1; else entry.losses += 1;
      entry.lastScore = totals[i];
      history[key] = entry;
    });
    saveHistory(history);
  }

  // ---------- derived state ----------

  function runningTotals() {
    var totals = state.players.map(function () { return 0; });
    state.rounds.forEach(function (r) {
      r.scores.forEach(function (s, i) { totals[i] += s; });
    });
    return totals;
  }

  function currentStarterIndex() {
    var n = state.players.length;
    return (state.starterIndex + state.rounds.length) % n;
  }

  function isGameOver() {
    if (state.rounds.length === 0) return false;
    if (state.endMode === "once") {
      return state.rounds.length >= state.players.length;
    }
    if (state.endMode === "rounds") {
      return state.rounds.length >= state.totalRounds;
    }
    var totals = runningTotals();
    return totals.some(function (t) { return t >= state.targetScore; });
  }

  function leaderIndices() {
    if (state.rounds.length === 0) return [];
    var totals = runningTotals();
    var min = Math.min.apply(null, totals);
    var idxs = [];
    totals.forEach(function (t, i) { if (t === min) idxs.push(i); });
    return idxs;
  }

  function winnerIndices() {
    var totals = runningTotals();
    var min = Math.min.apply(null, totals);
    var idxs = [];
    totals.forEach(function (t, i) { if (t === min) idxs.push(i); });
    return idxs;
  }

  // ---------- setup screen ----------

  var nameListEl = document.getElementById("name-list");
  var playerCountInput = document.getElementById("input-player-count");
  var starterSelect = document.getElementById("input-starter");
  var targetInputWrap = document.getElementById("target-input-wrap");
  var targetInput = document.getElementById("input-target");
  var targetHint = document.getElementById("target-hint");
  var roundsInputWrap = document.getElementById("rounds-input-wrap");
  var roundsInput = document.getElementById("input-rounds");
  var setupError = document.getElementById("setup-error");

  function renderNameInputs() {
    var n = clamp(parseInt(playerCountInput.value, 10) || 0, 2, 12);
    var existing = Array.prototype.slice.call(nameListEl.querySelectorAll("input")).map(function (i) { return i.value; });
    nameListEl.innerHTML = "";
    for (var i = 0; i < n; i++) {
      var row = document.createElement("div");
      row.className = "name-row";
      var seat = document.createElement("div");
      seat.className = "seat-num";
      seat.textContent = (i + 1);
      var input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Player " + (i + 1) + " name";
      input.value = existing[i] || "";
      input.maxLength = 24;
      input.addEventListener("input", renderStarterOptions);
      row.appendChild(seat);
      row.appendChild(input);
      nameListEl.appendChild(row);
    }
    renderStarterOptions();
    updateTargetHint();
  }

  function currentSetupNames() {
    return Array.prototype.slice.call(nameListEl.querySelectorAll("input")).map(function (i) {
      return i.value.trim();
    });
  }

  function renderStarterOptions() {
    var names = currentSetupNames();
    var prevValue = starterSelect.value;
    starterSelect.innerHTML = "";
    names.forEach(function (name, i) {
      var opt = document.createElement("option");
      opt.value = i;
      opt.textContent = name || ("Player " + (i + 1));
      starterSelect.appendChild(opt);
    });
    if (prevValue && parseInt(prevValue, 10) < names.length) starterSelect.value = prevValue;
  }

  function updateTargetHint() {
    var n = clamp(parseInt(playerCountInput.value, 10) || 0, 2, 12);
    var suggestion = n <= 5 ? "350–500" : "250–350";
    targetHint.textContent = "Suggested for " + n + " players: " + suggestion + " points";
    if (!targetInput.value) targetInput.placeholder = "e.g. " + (n <= 5 ? 400 : 300);
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  playerCountInput.addEventListener("input", renderNameInputs);

  document.getElementById("end-mode-choice").addEventListener("change", function () {
    var mode = document.querySelector('input[name="end-mode"]:checked').value;
    targetInputWrap.style.display = mode === "target" ? "flex" : "none";
    roundsInputWrap.style.display = mode === "rounds" ? "flex" : "none";
    document.querySelectorAll(".radio-option").forEach(function (el) {
      el.classList.toggle("checked", el.getAttribute("data-mode") === mode);
    });
  });
  document.querySelector('.radio-option[data-mode="once"]').classList.add("checked");

  document.getElementById("btn-start-game").addEventListener("click", function () {
    var names = currentSetupNames();
    setupError.textContent = "";

    if (names.some(function (n) { return !n; })) {
      setupError.textContent = "Please enter a name for every player.";
      return;
    }
    var seen = {};
    for (var i = 0; i < names.length; i++) {
      var key = names[i].toLowerCase();
      if (seen[key]) { setupError.textContent = "Player names must be unique."; return; }
      seen[key] = true;
    }

    var mode = document.querySelector('input[name="end-mode"]:checked').value;
    var target = null;
    var totalRounds = null;
    if (mode === "target") {
      target = parseInt(targetInput.value, 10);
      if (!target || target <= 0) {
        setupError.textContent = "Enter a target score greater than 0.";
        return;
      }
    } else if (mode === "rounds") {
      totalRounds = parseInt(roundsInput.value, 10);
      if (!totalRounds || totalRounds <= 0) {
        setupError.textContent = "Enter a number of rounds greater than 0.";
        return;
      }
    }

    state = {
      players: names,
      endMode: mode,
      targetScore: target,
      totalRounds: totalRounds,
      starterIndex: parseInt(starterSelect.value, 10) || 0,
      rounds: []
    };
    editingRoundIndex = null;
    save();
    showScreen("game");
    renderGame();
  });

  // ---------- screen switching ----------

  function showScreen(name) {
    document.getElementById("screen-setup").classList.toggle("active", name === "setup");
    document.getElementById("screen-game").classList.toggle("active", name === "game");
  }

  // ---------- game screen rendering ----------

  var roundLabelEl = document.getElementById("game-round-label");
  var feltMetaEl = document.getElementById("felt-meta");
  var scoreboardHead = document.getElementById("scoreboard-head");
  var scoreboardBody = document.getElementById("scoreboard-body");
  var scoreboardFoot = document.getElementById("scoreboard-foot");
  var scoreboardEmpty = document.getElementById("scoreboard-empty");
  var entrySlot = document.getElementById("entry-panel-slot");

  function renderGame() {
    var gameOver = isGameOver();
    var totals = runningTotals();
    var leaders = leaderIndices();

    roundLabelEl.textContent = gameOver ? "Game Over" : "Round " + (state.rounds.length + 1);

    // felt meta chips
    feltMetaEl.innerHTML = "";
    var modeChip = document.createElement("span");
    modeChip.className = "chip";
    modeChip.textContent = state.endMode === "once"
      ? ("Once Around · " + state.rounds.length + " / " + state.players.length + " rounds")
      : state.endMode === "rounds"
      ? ("Round " + state.rounds.length + " / " + state.totalRounds)
      : ("Target " + state.targetScore + " pts");
    feltMetaEl.appendChild(modeChip);

    if (!gameOver && state.rounds.length === 0) {
      var starterChip = document.createElement("span");
      starterChip.className = "chip";
      starterChip.textContent = state.players[currentStarterIndex()] + " starts";
      feltMetaEl.appendChild(starterChip);
    }

    if (leaders.length && state.rounds.length > 0) {
      var leaderChip = document.createElement("span");
      leaderChip.className = "chip leader";
      var label = leaders.length === 1
        ? (state.players[leaders[0]] + " leads")
        : "Tied for the lead";
      leaderChip.innerHTML = '<span class="crown">&#9819;</span> ' + escapeHtml(label);
      feltMetaEl.appendChild(leaderChip);
    }

    // table head
    scoreboardHead.innerHTML = "<th>Round</th>" + state.players.map(function (name, i) {
      var isLead = leaders.indexOf(i) !== -1 && state.rounds.length > 0;
      return '<th class="player-col' + (isLead ? " is-leader" : "") + '">' + escapeHtml(name) + (isLead ? " &#9819;" : "") + '</th>';
    }).join("");

    // table body
    scoreboardBody.innerHTML = "";
    if (state.rounds.length === 0) {
      scoreboardEmpty.style.display = "block";
    } else {
      scoreboardEmpty.style.display = "none";
      state.rounds.forEach(function (r, ri) {
        var tr = document.createElement("tr");
        var cells = '<td>' +
          '<div class="player-name-cell">' + (ri + 1) +
          ' <button class="round-edit-btn" data-round="' + ri + '">edit</button></div></td>';
        state.players.forEach(function (name, pi) {
          if (pi === r.wentOutIndex) {
            cells += '<td class="out-cell num">0 (out)</td>';
          } else {
            cells += '<td class="num">' + r.scores[pi] + '</td>';
          }
        });
        tr.innerHTML = cells;
        scoreboardBody.appendChild(tr);
      });
    }

    // totals row
    scoreboardFoot.innerHTML = "";
    var totalTr = document.createElement("tr");
    totalTr.className = "total-row";
    var totalCells = "<td>Total</td>";
    totals.forEach(function (t, i) {
      var isLead = leaders.indexOf(i) !== -1 && state.rounds.length > 0;
      totalCells += '<td class="num' + (isLead ? " leader-total" : "") + '">' + t + '</td>';
    });
    totalTr.innerHTML = totalCells;
    scoreboardFoot.appendChild(totalTr);

    Array.prototype.forEach.call(scoreboardBody.querySelectorAll(".round-edit-btn"), function (btn) {
      btn.addEventListener("click", function () {
        editingRoundIndex = parseInt(btn.getAttribute("data-round"), 10);
        renderEntryPanel();
        entrySlot.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    renderEntryPanel();
    save();
  }

  function renderEntryPanel() {
    var gameOver = isGameOver();

    if (gameOver && editingRoundIndex === null) {
      entrySlot.innerHTML = "";
      var totals = runningTotals();
      var winners = winnerIndices();
      var panel = document.createElement("div");
      panel.className = "gameover-panel";
      var winnerText = winners.length === 1
        ? state.players[winners[0]]
        : winners.map(function (i) { return state.players[i]; }).join(" & ");
      panel.innerHTML =
        '<div class="trophy">&#127942;</div>' +
        '<div class="winner-name">' + escapeHtml(winnerText) + '</div>' +
        '<div class="winner-sub">' + (winners.length === 1 ? "wins" : "tie") + ' with the lowest score' +
        (winners.length === 1 ? (" — " + totals[winners[0]] + " points") : "") + '</div>';
      entrySlot.appendChild(panel);
      return;
    }

    var roundIndex = editingRoundIndex !== null ? editingRoundIndex : state.rounds.length;
    var existing = editingRoundIndex !== null ? state.rounds[editingRoundIndex] : null;
    var selectedOut = existing ? existing.wentOutIndex : null;

    var wrap = document.createElement("div");
    wrap.className = "entry-panel";

    var heading = document.createElement("h2");
    heading.textContent = editingRoundIndex !== null ? ("Edit Round " + (roundIndex + 1)) : ("Round " + (roundIndex + 1) + ": Enter Scores");
    var sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = "Tap the player who went out (they score 0), then enter everyone else's remaining card points.";

    var outPicker = document.createElement("div");
    outPicker.className = "out-picker";
    state.players.forEach(function (name, i) {
      var pill = document.createElement("button");
      pill.type = "button";
      pill.className = "out-pill" + (selectedOut === i ? " selected" : "");
      pill.textContent = name;
      pill.setAttribute("data-idx", i);
      pill.addEventListener("click", function () {
        selectedOut = i;
        Array.prototype.forEach.call(outPicker.querySelectorAll(".out-pill"), function (p) {
          p.classList.toggle("selected", parseInt(p.getAttribute("data-idx"), 10) === i);
        });
        renderScoreInputs();
      });
      outPicker.appendChild(pill);
    });

    var scoreInputsWrap = document.createElement("div");
    scoreInputsWrap.className = "score-inputs";

    function renderScoreInputs() {
      scoreInputsWrap.innerHTML = "";
      state.players.forEach(function (name, i) {
        var row = document.createElement("div");
        row.className = "score-input-row";
        if (i === selectedOut) {
          row.innerHTML = '<span class="pname out-label">' + escapeHtml(name) + ' — out (0 pts)</span>';
        } else {
          var val = existing ? existing.scores[i] : "";
          row.innerHTML = '<span class="pname">' + escapeHtml(name) + '</span>' +
            '<input type="number" min="0" step="5" class="score-field" data-idx="' + i + '" value="' + (val === undefined ? "" : val) + '" placeholder="0">';
        }
        scoreInputsWrap.appendChild(row);
      });
    }
    renderScoreInputs();

    var errorEl = document.createElement("div");
    errorEl.className = "error-text";

    var actions = document.createElement("div");
    actions.className = "entry-actions";

    var submitBtn = document.createElement("button");
    submitBtn.className = "btn primary";
    submitBtn.textContent = editingRoundIndex !== null ? "Save Round" : "Add Round";

    submitBtn.addEventListener("click", function () {
      if (selectedOut === null || selectedOut === undefined) {
        errorEl.textContent = "Select who went out this round.";
        return;
      }
      var scores = state.players.map(function () { return 0; });
      var fields = scoreInputsWrap.querySelectorAll(".score-field");
      var ok = true;
      Array.prototype.forEach.call(fields, function (f) {
        var idx = parseInt(f.getAttribute("data-idx"), 10);
        var v = f.value.trim() === "" ? NaN : parseInt(f.value, 10);
        if (isNaN(v) || v < 0) { ok = false; return; }
        scores[idx] = v;
      });
      if (!ok) {
        errorEl.textContent = "Enter a valid non-negative point total for every remaining player.";
        return;
      }
      var roundData = { wentOutIndex: selectedOut, scores: scores };
      if (editingRoundIndex !== null) {
        state.rounds[editingRoundIndex] = roundData;
      } else {
        state.rounds.push(roundData);
      }
      editingRoundIndex = null;
      renderGame();
    });

    actions.appendChild(submitBtn);

    if (editingRoundIndex !== null) {
      var cancelBtn = document.createElement("button");
      cancelBtn.className = "btn secondary";
      cancelBtn.textContent = "Cancel";
      cancelBtn.addEventListener("click", function () {
        editingRoundIndex = null;
        renderEntryPanel();
      });
      actions.appendChild(cancelBtn);
    }

    wrap.appendChild(heading);
    wrap.appendChild(sub);
    wrap.appendChild(outPicker);
    wrap.appendChild(scoreInputsWrap);
    wrap.appendChild(errorEl);
    wrap.appendChild(actions);

    entrySlot.innerHTML = "";
    entrySlot.appendChild(wrap);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- new game / reset ----------

  var confirmModal = document.getElementById("confirm-modal");
  var confirmModalText = document.getElementById("confirm-modal-text");
  var confirmModalOk = document.getElementById("confirm-modal-ok");
  var confirmModalCancel = document.getElementById("confirm-modal-cancel");

  function askConfirm(text, onConfirm) {
    confirmModalText.textContent = text;
    confirmModal.classList.add("active");
    function cleanup() {
      confirmModal.classList.remove("active");
      confirmModalOk.removeEventListener("click", okHandler);
      confirmModalCancel.removeEventListener("click", cancelHandler);
    }
    function okHandler() { cleanup(); onConfirm(); }
    function cancelHandler() { cleanup(); }
    confirmModalOk.addEventListener("click", okHandler);
    confirmModalCancel.addEventListener("click", cancelHandler);
  }

  document.getElementById("btn-new-game").addEventListener("click", function () {
    askConfirm("Start a new game? This will clear the current scoreboard.", function () {
      commitGameToHistory();
      state = null;
      editingRoundIndex = null;
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      showScreen("setup");
    });
  });

  // ---------- player history ----------

  var historyModal = document.getElementById("history-modal");
  var historyTableWrap = document.getElementById("history-table-wrap");
  var historyTableBody = document.getElementById("history-table-body");
  var historyEmpty = document.getElementById("history-empty");

  function renderHistoryModal() {
    var history = loadHistory();
    var keys = Object.keys(history).sort(function (a, b) {
      return history[a].displayName.localeCompare(history[b].displayName);
    });
    if (keys.length === 0) {
      historyTableWrap.style.display = "none";
      historyEmpty.style.display = "block";
      historyTableBody.innerHTML = "";
      return;
    }
    historyTableWrap.style.display = "block";
    historyEmpty.style.display = "none";
    historyTableBody.innerHTML = keys.map(function (k) {
      var e = history[k];
      return "<tr><td>" + escapeHtml(e.displayName) + '</td><td class="num">' + e.played +
        '</td><td class="num">' + e.wins + '</td><td class="num">' + e.losses +
        '</td><td class="num">' + e.lastScore + "</td></tr>";
    }).join("");
  }

  function openHistoryModal() {
    renderHistoryModal();
    historyModal.classList.add("active");
  }

  function closeHistoryModal() {
    historyModal.classList.remove("active");
  }

  document.getElementById("btn-view-history-setup").addEventListener("click", openHistoryModal);
  document.getElementById("btn-view-history-game").addEventListener("click", openHistoryModal);
  document.getElementById("btn-close-history").addEventListener("click", closeHistoryModal);
  document.getElementById("btn-clear-history").addEventListener("click", function () {
    askConfirm("Clear all player history? This cannot be undone.", function () {
      try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
      renderHistoryModal();
    });
  });

  // ---------- init ----------

  renderNameInputs();

  var loaded = load();
  if (loaded) {
    state = loaded;
    showScreen("game");
    renderGame();
  }
})();
</script>
